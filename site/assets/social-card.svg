<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Right Shape</title><desc id="desc">Give the work its right shape. Then prove it. An illustrative ladder of ten rungs with one placement below a ceiling.</desc><rect width="1200" height="630" fill="#f6f4ee"/><path d="M60 94H1140M60 560H1140" stroke="#d8d8cc"/><text x="60" y="62" font-family="Arial, sans-serif" font-size="20" fill="#64685e">An Amplifier skill</text><text x="60" y="255" font-family="Georgia, serif" font-size="96" letter-spacing="-4" fill="#252823">Right</text><text x="60" y="352" font-family="Georgia, serif" font-size="96" letter-spacing="-4" fill="#252823">Shape</text><text x="64" y="425" font-family="Arial, sans-serif" font-size="25" fill="#64685e">Give the work its right shape.</text><text x="64" y="464" font-family="Arial, sans-serif" font-size="25" fill="#64685e">Then prove it.</text><g fill="#f6f4ee" stroke="#d8d8cc" stroke-width="2"><rect x="700" y="420" width="34" height="40"/><rect x="742" y="400" width="34" height="60"/><rect x="784" y="380" width="34" height="80"/><rect x="826" y="360" width="34" height="100"/><rect x="868" y="340" width="34" height="120"/><rect x="952" y="300" width="34" height="160" stroke-dasharray="6 5"/><rect x="994" y="280" width="34" height="180" stroke-dasharray="6 5"/><rect x="1036" y="260" width="34" height="200" stroke-dasharray="6 5"/><rect x="1078" y="240" width="34" height="220" stroke-dasharray="6 5"/></g><rect x="910" y="320" width="34" height="140" fill="#574a78"/><path d="M948 200V480" stroke="#8a3b2e" stroke-width="3"/><text x="956" y="214" font-family="Arial, sans-serif" font-size="17" fill="#8a3b2e">ceiling</text><text x="700" y="520" font-family="Arial, sans-serif" font-size="17" fill="#64685e">Illustrative placement. Not measured data.</text></svg>
